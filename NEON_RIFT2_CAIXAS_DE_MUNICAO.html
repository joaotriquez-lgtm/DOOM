const Music={
  player:new Audio(), order:[],last:-1,index:-1,ready:false,unlocked:false,failed:0,
  init(){
    if(this.ready)return;
    this.ready=true;
    this.player.preload='auto';
    this.player.loop=false;
    this.player.addEventListener('ended',()=>{if(state==='play'&&S.cfg.audioOn!==false)this.next()});
    this.player.addEventListener('playing',()=>{this.failed=0});
    this.player.addEventListener('error',()=>{
      if(state!=='play'||S.cfg.audioOn===false)return;
      this.failed++;
      console.error('Falha ao carregar a música:',this.player.currentSrc||this.player.src);
      if(this.failed<MUSIC_TRACKS.length)this.next();
      else console.error('Nenhuma das músicas pôde ser carregada. Confira se a pasta "audio" está ao lado do arquivo HTML.');
    });
    this.apply();
  },
  apply(){
    if(!this.ready)return;
    this.player.volume=cl(Number(S.cfg.musicVol)||0,0,1);
    // O áudio só pode tocar quando o estado real do jogo for a partida.
    if(state!=='play'||S.cfg.audioOn===false||this.player.volume===0){
      this.player.pause();
      return;
    }
    if(this.unlocked){
      if(!this.player.src)this.next();
      else this.player.play().catch(()=>{});
    }
  },
  unlock(){
    this.unlocked=true;
    // Um clique em menus/configurações apenas libera o áudio do navegador;
    // nunca deve iniciar a trilha fora da partida.
    if(state==='play'&&S.cfg.audioOn!==false&&this.player.volume>0){
      if(!this.player.src)this.next();
      else this.player.play().catch(()=>{});
    }
  },
  shuffle(){
    this.order=MUSIC_TRACKS.map((_,i)=>i);
    for(let i=this.order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[this.order[i],this.order[j]]=[this.order[j],this.order[i]]}
    if(this.order.length>1&&this.order[0]===this.last)[this.order[0],this.order[1]]=[this.order[1],this.order[0]];
  },
  next(){
    if(state!=='play'||S.cfg.audioOn===false)return;
    if(!this.order.length)this.shuffle();
    if(!this.order.length)return;
    let idx=this.order.shift();
    if(idx===this.last&&this.order.length){this.order.push(idx);idx=this.order.shift()}
    this.last=idx;this.index=idx;
    this.player.pause();
    this.player.currentTime=0;
    this.player.src=new URL(MUSIC_TRACKS[idx],document.baseURI).href;
    this.player.load();
    this.player.volume=cl(Number(S.cfg.musicVol)||0,0,1);
    if(state==='play'&&S.cfg.audioOn!==false&&this.unlocked)this.player.play().catch(()=>{});
  },
  start(){
    this.init();
    // Não iniciar nem retomar a música em menu, configurações ou pausa.
    if(state!=='play'){
      this.pause();
      return;
    }
    this.player.volume=cl(Number(S.cfg.musicVol)||0,0,1);
    if(S.cfg.audioOn===false||this.player.volume===0){this.pause();return}
    if(!this.player.src||this.player.ended)this.next();
    else if(this.unlocked)this.player.play().catch(()=>{});
  },
  pause(){if(this.ready)this.player.pause()},
  stop(){
    if(!this.ready)return;
    this.player.pause();
    try{this.player.currentTime=0}catch(e){}
    this.player.removeAttribute('src');
    this.player.load();
  },
  setVolume(v){S.cfg.musicVol=cl(+v,0,1);sv();this.apply()},
  toggle(){
    S.cfg.audioOn=!S.cfg.audioOn;sv();
    if(S.cfg.audioOn){if(state==='play')this.start();else this.pause()}
    else this.pause();
    return S.cfg.audioOn;
  }
};

let currentMenu='main',gpReturnMenu='main',cfReturnMenu='main';

const MenuNav={
  focusedEl:null,
  savedKey:null,
  dirHeld:null,
  repeatTimer:0,
  actionLock:0,
  dialogOpen:false,
  dialogOnConfirm:null,

  isVisible(){
    return this.dialogOpen || ($('m') && $('m').style.display !== 'none');
  },

  getContainer(){
    return this.dialogOpen ? $('gpDialog') : $('m');
  },

  getItems(){
    const root=this.getContainer();
    if(!root)return[];
    return Array.from(root.querySelectorAll('button:not(:disabled),input[type="range"]:not(:disabled),input[type="checkbox"]:not(:disabled),select:not(:disabled),[data-nav]:not([disabled])'))
      .filter(el=>el.offsetParent!==null && !el.closest('[hidden]'));
  },

  getNavKey(el){
    if(!el)return null;
    if(el.dataset && el.dataset.navKey)return el.dataset.navKey;
    if(el.id)return 'id:'+el.id;
    const oc=el.getAttribute('onclick')||el.getAttribute('oninput')||el.getAttribute('onchange')||'';
    return oc ? 'fn:'+oc : 'txt:'+el.textContent.trim();
  },

  setFocus(el,scroll=true){
    const items=this.getItems();
    items.forEach(item=>{
      const active=(item===el);
      item.classList.toggle('gp-focus',active);
      if(item.parentElement && item.parentElement.classList.contains('row')){
        item.parentElement.classList.toggle('gp-row-active',active);
      }
    });
    this.focusedEl=el||null;
    this.savedKey=this.getNavKey(el);
    if(el){
      try{el.focus({preventScroll:true})}catch(e){}
      if(scroll){
        try{el.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'})}catch(e){}
      }
    }
  },

  sync(preserveFocus=false){
    const items=this.getItems();
    const bar=$('gpNavBar');
    if(bar)bar.classList.toggle('show',this.isVisible() && GP.connected && !GP.listening);
    if(!items.length){this.focusedEl=null;return}
    let target=null;
    if(preserveFocus && this.savedKey){
      target=items.find(el=>this.getNavKey(el)===this.savedKey)||null;
    }
    if(!target && this.focusedEl && items.includes(this.focusedEl)){
      target=this.focusedEl;
    }
    if(!target)target=items[0];
    this.setFocus(target,false);
  },

  findNeighbor(dir){
    const items=this.getItems();
    if(!items.length)return null;
    if(!this.focusedEl || !items.includes(this.focusedEl))return items[0];
    if(items.length===1)return items[0];

    const cur=this.focusedEl;
    const cr=cur.getBoundingClientRect();
    const cx=cr.left+cr.width/2,cy=cr.top+cr.height/2;

    let best=null,bestScore=1e9;
    for(const cand of items){
      if(cand===cur)continue;
      const r=cand.getBoundingClientRect();
      const x=r.left+r.width/2,y=r.top+r.height/2;
      const dx=x-cx,dy=y-cy;

      if(dir==='up' && dy>=-4)continue;
      if(dir==='down' && dy<=4)continue;
      if(dir==='left' && dx>=-4)continue;
      if(dir==='right' && dx<=4)continue;

      let score=1e9;
      if(dir==='up'||dir==='down'){
        const p=Math.abs(dy),s=Math.abs(dx);
        const colLimit=Math.max(cr.width,r.width)*.85;
        score=p + s*(s>colLimit?3.6:1.8);
      }else{
        const p=Math.abs(dx),s=Math.abs(dy);
        const sameRow=s<32;
        score=p + s*(sameRow?1.2:4.5);
      }
      if(score<bestScore){bestScore=score;best=cand}
    }

    if(!best){
      const idx=items.indexOf(cur);
      if(dir==='down')best=items[0];
      else if(dir==='up')best=items[items.length-1];
      else if(dir==='right')best=items[(idx+1)%items.length];
      else if(dir==='left')best=items[(idx-1+items.length)%items.length];
    }
    return best;
  },

  adjustControl(el,dir){
    if(!el)return false;
    if(el.tagName==='INPUT' && el.type==='range'){
      const step=parseFloat(el.step)||.05;
      const min=parseFloat(el.min);
      const max=parseFloat(el.max);
      const val=parseFloat(el.value);
      const next=cl(Math.round((val+(dir==='right'?step:-step))*1000)/1000,min,max);
      if(next!==val){
        el.value=next;
        el.dispatchEvent(new Event('input',{bubbles:true}));
        snd(520,.025,'sine',.035,1.08);
      }
      return true;
    }
    return false;
  },

  activate(el){
    if(!el || el.disabled)return;
    if(el.tagName==='INPUT' && el.type==='checkbox'){
      el.checked=!el.checked;
      el.dispatchEvent(new Event('change',{bubbles:true}));
      snd(580,.05,'sine',.06,1.2);
      return;
    }
    if(el.tagName==='INPUT' && el.type==='range'){
      snd(480,.04,'sine',.05,1.1);
      return;
    }
    el.click();
  },

  handleDirection(dir,dt){
    if(!dir){
      this.dirHeld=null;
      this.repeatTimer=0;
      return;
    }
    const isNew=(this.dirHeld!==dir);
    if(isNew){
      this.dirHeld=dir;
      this.repeatTimer=.32;
    }else{
      this.repeatTimer-=dt;
      if(this.repeatTimer>0)return;
      this.repeatTimer=.13;
    }

    if(!this.focusedEl || !this.getItems().includes(this.focusedEl)){
      this.sync(false);
      return;
    }

    if((dir==='left'||dir==='right') && this.adjustControl(this.focusedEl,dir)){
      return;
    }

    const next=this.findNeighbor(dir);
    if(next && next!==this.focusedEl){
      this.setFocus(next,true);
      snd(440,.03,'sine',.04,1.1);
    }
  },

  openDialog(title,message,confirmText,onConfirm){
    this.dialogOpen=true;
    this.dialogOnConfirm=onConfirm;
    const dlg=$('gpDialog');
    dlg.innerHTML=`<div class="gp-dlg-box">
      <h2>${title}</h2>
      <p>${message}</p>
      <div class="gp-dlg-actions">
        <button data-nav-key="dlg-confirm" onclick="MenuNav.confirmDialog()">${confirmText||'Confirmar'}</button>
        <button data-nav-key="dlg-cancel" style="border-color:var(--a)" onclick="MenuNav.closeDialog()">Cancelar</button>
      </div>
    </div>`;
    dlg.classList.add('show');
    this.actionLock=.2;
    this.sync(false);
  },

  openResetDialog(onConfirm){
    this.dialogOpen=true;
    this.dialogOnConfirm=onConfirm;
    const dlg=$('gpDialog');
    dlg.innerHTML=`<div class="gp-dlg-box">
      <h2 style="color:var(--a)">RESETAR TODO O PROGRESSO</h2>
      <p>Tem certeza de que deseja apagar TODO o seu progresso? Essa ação não poderá ser desfeita.</p>
      <div class="gp-dlg-actions">
        <button data-nav-key="dlg-cancel" style="border-color:var(--a)" onclick="MenuNav.closeDialog()">CANCELAR</button>
        <button data-nav-key="dlg-confirm" style="border-color:var(--a);background:#ff2a6d22" onclick="MenuNav.confirmDialog()">CONFIRMAR RESET</button>
      </div>
    </div>`;
    dlg.classList.add('show');
    this.actionLock=.2;
    this.sync(false);
  },

  confirmDialog(){
    const fn=this.dialogOnConfirm;
    this.closeDialog();
    if(typeof fn==='function')fn();
  },

  closeDialog(){
    this.dialogOpen=false;
    this.dialogOnConfirm=null;
    const dlg=$('gpDialog');
    if(dlg){dlg.classList.remove('show');dlg.innerHTML=''}
    this.actionLock=.2;
    this.sync(true);
  },

  goBack(){
    if(this.dialogOpen){
      this.closeDialog();
      snd(340,.05,'square',.05,.8);
      return true;
    }
    if(state==='pause' && currentMenu==='pause'){
      G.res(true);
      return true;
    }
    if(currentMenu==='gp'){
      menu(gpReturnMenu,null,false);
      snd(340,.05,'square',.05,.8);
      return true;
    }
    if(currentMenu==='cf'){
      menu(cfReturnMenu,null,false);
      snd(340,.05,'square',.05,.8);
      return true;
    }
    if(currentMenu!=='main' && state==='menu'){
      menu('main',null,false);
      snd(340,.05,'square',.05,.8);
      return true;
    }
    return false;
  },

  update(dt,navInput){
    if(this.actionLock>0)this.actionLock-=dt;
    if(!this.isVisible())return;

    this.handleDirection(navInput.dir,dt);

    if(this.actionLock>0)return;

    if(navInput.confirm){
      this.actionLock=.2;
      if(!this.focusedEl || !this.getItems().includes(this.focusedEl))this.sync(false);
      this.activate(this.focusedEl);
      return;
    }
    if(navInput.back){
      this.actionLock=.2;
      this.goBack();
      return;
    }
    if(navInput.start){
      this.actionLock=.25;
      if(this.dialogOpen){
        this.closeDialog();
      }else if(state==='pause' && currentMenu==='pause'){
        G.res(true);
      }else if(currentMenu==='main'){
        openCfMenu('main');
      }else if(currentMenu==='cf'){
        openGpMenu('cf');
      }else{
        this.goBack();
      }
    }
  }
};

      };

      return arr[b.index]||`Botão ${b.index}`;
    }
    if(b.type==='axis'){
      const stdAxes={
        '0:-1':'Analógico Esq. ←','0:1':'Analógico Esq. →',

      return stdAxes[key]?`${stdAxes[key]} (E${b.index}${b.dir>0?'+':'-'})`:`Eixo ${b.index}${b.dir>0?'+':'-'}`;
    }

  toast(text,warn=false){
    const el=$('gpToast');if(!el)return;
    el.textContent=text;
    el.className='show'+(warn?' warn':'');
    clearTimeout(this.toastTimer);
    this.toastTimer=setTimeout(()=>{el.className=warn?'warn':''},3600);
  },

  getActiveGamepad(){
    if(this.blocked || !navigator || typeof navigator.getGamepads!=='function')return null;
    try{
      const list=navigator.getGamepads();
      if(!list)return null;
      if(this.index>=0&&list[this.index]&&list[this.index].connected)return list[this.index];
      for(let i=0;i<list.length;i++){
        const g=list[i];
        if(g&&g.connected&&(g.buttons.length>0||g.axes.length>0))return g;
      }
    }catch(e){
      this.blocked=true;
    }
    return null;
  },

  onConnect(gp){
    this.connected=true;
    this.index=gp.index;
    this.id=this.cleanName(gp.id);
    this.profile=this.detectProfile(gp);
    this.toast(`CONTROLE CONECTADO: ${this.id} [${this.profile.label}]`,false);
    if(currentMenu==='gp')menu('gp',null,true);
    else MenuNav.sync(true);
  },

  onDisconnect(gp){
    const wasActive=!gp||gp.index===this.index||!this.getActiveGamepad();
    const other=this.getActiveGamepad();
    if(other){
      this.connected=true;
      this.index=other.index;
      this.id=this.cleanName(other.id);
      this.profile=this.detectProfile(other);
      this.toast(`CONTROLE ALTERNADO: ${this.id}`,false);
    }else if(wasActive){
      this.connected=false;
      this.index=-1;
      this.id='';
      this.listening=null;
      resetInputs();
      this.toast('AVISO: CONTROLE DESCONECTADO! Teclado e mouse ativos.',true);
      if(state==='play')pauseGame();
    }
    if(currentMenu==='gp')menu('gp',null,true);
    else MenuNav.sync(true);
  },

  startBind(actionKey){
    const gp=this.getActiveGamepad();
    if(!gp){
      this.toast(this.blocked?'Acesso ao Gamepad bloqueado pelo navegador/iframe.':'Conecte um controle primeiro para mapear comandos!',true);
      return;
    }
    this.listening=actionKey;
    this.listenTimer=8.0;
    this.baseline={
      buttons:gp.buttons.map(b=>!!(b&&(b.pressed||b.value>.5))),
      axes:Array.from(gp.axes||[])
    };
    snd(520,.07,'sine',.07,1.2);
    menu('gp',null,true);
  },

  cancelBind(){

  clearBind(actionKey){

  resetDefaults(){

  readBinding(gp,b,dz){
    if(!gp||!b)return 0;
    if(b.type==='button'){
      const btn=gp.buttons[b.index];
      if(!btn)return 0;
      const v=typeof btn.value==='number'?btn.value:(btn.pressed?1:0);
      if(btn.pressed)return Math.max(v,1);
      return v>.14?(v-.14)/.86:0;
    }
    if(b.type==='axis'){
      const raw=(gp.axes&&gp.axes[b.index])||0;
      const signed=raw*b.dir;
      if(signed<=dz)return 0;
      return cl((signed-dz)/(1-dz),0,1);
    }
    return 0;
  },

  handleCapture(gp,dt){
    if(!gp||!this.listening||!this.baseline)return;
    this.listenTimer-=dt;
    const btnEl=document.querySelector('.gp-btn-map.listening');
    if(btnEl)btnEl.textContent=`Pressione... (${Math.max(1,Math.ceil(this.listenTimer))}s)`;
    if(this.listenTimer<=0){
      this.toast('Tempo esgotado. Mapeamento cancelado.',true);
      this.cancelBind();
      return;
    }

    for(let i=0;i<gp.buttons.length;i++){
      const btn=gp.buttons[i];
      const nowPressed=!!(btn&&(btn.pressed||btn.value>.55));
      if(!nowPressed && this.baseline.buttons[i]){
        this.baseline.buttons[i]=false;
      }else if(nowPressed && !this.baseline.buttons[i]){
        S.gp.bindings[this.listening]={type:'button',index:i};
        this.listening=null;
        this.baseline=null;
        this.prev={};
        this.prevNav={confirm:true,back:true,start:true};
        MenuNav.actionLock=.28;
        sv();
        snd(760,.09,'sine',.09,1.35);
        menu('gp',null,true);
        return;
      }
    }

    for(let i=0;i<(gp.axes?gp.axes.length:0);i++){
      const cur=gp.axes[i]||0;
      const base=this.baseline.axes[i]||0;
      if(Math.abs(cur)<.25 && Math.abs(base)>.5)this.baseline.axes[i]=0;
      if(Math.abs(cur-base)>.55 && Math.abs(cur)>.55){
        S.gp.bindings[this.listening]={type:'axis',index:i,dir:cur>0?1:-1};
        this.listening=null;
        this.baseline=null;
        this.prev={};
        this.prevNav={confirm:true,back:true,start:true};
        MenuNav.actionLock=.28;
        sv();
        snd(760,.09,'sine',.09,1.35);
        menu('gp',null,true);
        return;
      }
    }
  },

  updateTesterUI(gp,vals){
    const dzPct=Math.round(S.gp.deadzone*100);
    document.querySelectorAll('.gp-dz').forEach(el=>{el.style.width=dzPct+'%';el.style.height=dzPct+'%'});

    const lx=gp&&gp.axes?cl(gp.axes[0]||0,-1,1):0;
    const ly=gp&&gp.axes?cl(gp.axes[1]||0,-1,1):0;
    const rx=gp&&gp.axes?cl(gp.axes[2]||0,-1,1):0;
    const ry=gp&&gp.axes?cl(gp.axes[3]||0,-1,1):0;

    const lNub=$('gpNubL'),rNub=$('gpNubR');
    if(lNub)lNub.style.transform=`translate(${lx*34}px,${ly*34}px)`;
    if(rNub)rNub.style.transform=`translate(${rx*34}px,${ry*34}px)`;
    const lTxt=$('gpTxtL'),rTxt=$('gpTxtR');
    if(lTxt)lTxt.textContent=`X:${lx.toFixed(2)} Y:${ly.toFixed(2)}`;
    if(rTxt)rTxt.textContent=`X:${rx.toFixed(2)} Y:${ry.toFixed(2)}`;

    const rawBox=$('gpRawLive');
    if(rawBox){
      if(!gp){
        rawBox.innerHTML='<small>Conecte um controle e pressione qualquer botão ou mova os analógicos.</small>';
      }else{
        const activeInputs=[];
        gp.buttons.forEach((b,i)=>{
          if(b&&(b.pressed||b.value>.15)){
            const nm=this.formatBinding({type:'button',index:i});
            activeInputs.push(`<span class="gp-tag">${nm} (${Math.round((b.value||1)*100)}%)</span>`);
          }
        });
        (gp.axes||[]).forEach((v,i)=>{
          if(Math.abs(v)>S.gp.deadzone){
            const nm=this.formatBinding({type:'axis',index:i,dir:v>0?1:-1});
            activeInputs.push(`<span class="gp-tag">${nm} (${Math.round(Math.abs(v)*100)}%)</span>`);
          }
        });
        rawBox.innerHTML=activeInputs.length?activeInputs.join(''):'<small>Nenhum botão ou eixo ativo no momento.</small>';
      }
    }

    const actBox=$('gpActLive');
    if(actBox){
      const activeActs=this.actions.filter(a=>(vals[a.k]||0)>.1).map(a=>`<span class="gp-tag act">${a.label}</span>`);
      actBox.innerHTML=activeActs.length?activeActs.join(''):'<small>Aguardando comando...</small>';
    }
  },

  poll(dt){
    const gp=this.getActiveGamepad();
    if(gp&&!this.connected)this.onConnect(gp);
    else if(!gp&&this.connected)this.onDisconnect(null);

    if(!gp){
      Object.assign(gpState,{moveX:0,moveZ:0,lookX:0,lookY:0,fireHeld:false,jumpHeld:false,slideHeld:false,dashHeld:false});
      this.prev={};this.prevNav={};
      if(currentMenu==='gp')this.updateTesterUI(null,{});
      return;
    }

    if(this.listening){
      this.handleCapture(gp,dt);
      return;
    }

    const dz=S.gp.deadzone;
    const vals={},jp={};
    for(const a of this.actions){
      const v=this.readBinding(gp,S.gp.bindings[a.k],dz);
      vals[a.k]=v;
      const isDown=v>.45;
      jp[a.k]=isDown&&!this.prev[a.k];
      this.prev[a.k]=isDown;
    }

    let mx=vals.moveRight-vals.moveLeft;
    let mz=vals.moveFwd-vals.moveBack;
    if(S.gp.invertMoveY)mz=-mz;
    gpState.moveX=cl(mx,-1,1);
    gpState.moveZ=cl(mz,-1,1);

    const curve=v=>v>0?Math.pow(v,1.35):0;
    let lx=curve(vals.lookRight)-curve(vals.lookLeft);
    let ly=curve(vals.lookUp)-curve(vals.lookDown);
    if(S.gp.invertX)lx=-lx;
    if(S.gp.invertY)ly=-ly;
    gpState.lookX=lx;
    gpState.lookY=ly;

    gpState.fireHeld=vals.fire>.25;
    gpState.jumpHeld=vals.jump>.45;
    gpState.slideHeld=vals.slide>.45;
    gpState.dashHeld=vals.dash>.45;

    // Se o navegador tiver recusado a primeira tentativa de autoplay,
    // novas entradas do controle tentam retomar o contexto e o player.
    if(state==='play' && Object.values(jp).some(Boolean)){
      au();
      Music.unlock();
    }

    if(currentMenu==='gp')this.updateTesterUI(gp,vals);

    if(state==='play'){
      if(jp.jump)K.jp=1;
      if(jp.slide)K.cp=1;
      if(jp.dash)K.dash=1;
      if(jp.grapple)K.gp=1;
      if(jp.reload)rel();
      if(jp.nextWeapon)cycleWeapon(1);
      if(jp.prevWeapon)cycleWeapon(-1);
      if(jp.pause)pauseGame();
    }else{
      const btnDown=idx=>!!(gp.buttons[idx]&&(gp.buttons[idx].pressed||gp.buttons[idx].value>.5));
      const up=vals.moveFwd>.52 || btnDown(12) || (gp.axes&&gp.axes[1]<-.52);
      const down=vals.moveBack>.52 || btnDown(13) || (gp.axes&&gp.axes[1]>.52);
      const left=vals.moveLeft>.52 || btnDown(14) || (gp.axes&&gp.axes[0]<-.52);
      const right=vals.moveRight>.52 || btnDown(15) || (gp.axes&&gp.axes[0]>.52);

      let dir=null;
      if(up)dir='up';
      else if(down)dir='down';
      else if(left)dir='left';
      else if(right)dir='right';

      const confirmDown=vals.jump>.5 || btnDown(0);
      const backDown=vals.slide>.5 || btnDown(1);
      const startDown=vals.pause>.5 || btnDown(9);

      const navInput={
        dir,
        confirm:confirmDown && !this.prevNav.confirm,
        back:backDown && !this.prevNav.back,
        start:startDown && !this.prevNav.start
      };
      this.prevNav={confirm:confirmDown,back:backDown,start:startDown};

      // Gamepad/joystick também precisa avisar o barramento de áudio sobre
      // a primeira interação do jogador. Isso ocorre antes de MenuNav executar
      // a confirmação que pode iniciar a fase no mesmo ciclo de polling.
      const gamepadInteraction=Object.values(jp).some(Boolean) || !!dir ||
        navInput.confirm || navInput.back || navInput.start;
      if(gamepadInteraction){
        au();
        Music.unlock();
      }

      MenuNav.update(dt,navInput);
    }
  }
};

p.x+=v.x*s;if(coll(p.x,p.y,p.z,h,r)){p.x-=v.x*s;o.x=1;v.x=0}
p.z+=v.z*s;if(coll(p.x,p.y,p.z,h,r)){p.z-=v.z*s;o.z=1;v.z=0}
p.y+=v.y*s;if(coll(p.x,p.y,p.z,h,r)){p.y-=v.y*s;if(v.y<0)o.y=-1;v.y=0}}return o}

function healthBoxPosition(preferPlatform=false){
  // Alguns itens ficam no chão; outros podem aparecer em plataformas baixas e largas.
  if(preferPlatform){
    const platforms=B.filter(b=>b.y0>0&&b.y1<=6.2&&
      ((b.x1-b.x0)>=12&&(b.z1-b.z0)<=3.2||(b.z1-b.z0)>=12&&(b.x1-b.x0)<=3.2));
    for(let tries=0;tries<35&&platforms.length;tries++){
      const b=platforms[(R()*platforms.length)|0],x=(b.x0+b.x1)/2+(R()-.5)*Math.max(0,(b.x1-b.x0)-2),
        z=(b.z0+b.z1)/2+(R()-.5)*Math.max(0,(b.z1-b.z0)-2),y=b.y1+.72;
      if(H(x,z)<12||H(x,z)>54)continue;
      if(!coll(x,y,z,1.05,.55))return V(x,y,z);
    }
  }
  for(let tries=0;tries<100;tries++){
    const x=(R()-.5)*104,z=(R()-.5)*104,y=.7;
    if(H(x,z)<14||H(x,z)>53)continue;
    if(!coll(x,.1,z,1.1,.65))return V(x,y,z);
  }
  // Última alternativa: procura um ponto livre próximo ao centro; nunca devolve
  // uma coordenada aleatória que possa nascer dentro de uma parede/obstáculo.
  for(let tries=0;tries<160;tries++){
    const x=(R()-.5)*42,z=(R()-.5)*42;
    if(H(x,z)<14||H(x,z)>48)continue;
    if(!coll(x,.1,z,1.1,.65))return V(x,.7,z);
  }
  return V(0,.7,18);
}

function createHealthWave(){
  if(!T||!sc||!world)return;
  // Cada onda contém exatamente duas caixas; nunca há reposição individual.
  healthBoxes=[];
  for(let i=0;i<2;i++){
    const g=new T.Group();
    const glow=new T.Mesh(new T.BoxGeometry(.95,.72,.22),new T.MeshBasicMaterial({color:0x16b957}));
    const crossV=new T.Mesh(new T.BoxGeometry(.22,.58,.08),new T.MeshBasicMaterial({color:0xeaffef}));
    const crossH=new T.Mesh(new T.BoxGeometry(.58,.22,.08),new T.MeshBasicMaterial({color:0xeaffef}));
    glow.position.y=0;crossV.position.z=.14;crossH.position.z=.14;
    g.add(glow,crossV,crossH);
    const rim=new T.Mesh(new T.BoxGeometry(1.08,.84,.12),new T.MeshBasicMaterial({color:0x63ff9a,wireframe:true}));
    g.add(rim);
    const p=healthBoxPosition(i===1);g.position.copy(p);world.add(g);
    healthBoxes.push({g,active:true,baseY:p.y,phase:R()*6.28});
  }
}
function spawnHealthBoxes(){
  // Ao iniciar uma fase, aguarda 20 segundos antes da primeira onda.
  healthBoxes.forEach(q=>{if(q.g&&world)world.remove(q.g)});
  healthBoxes=[];
  healthSpawnTimer=20;
}
function updateHealthBoxes(dt){
  if(!T||!sc||!world)return;
  const waveFinished=healthBoxes.length===2&&healthBoxes.every(q=>!q.active);
  const waitingForFirstWave=healthBoxes.length===0;
  if(waitingForFirstWave||waveFinished){
    healthSpawnTimer-=dt;
    if(healthSpawnTimer<=0){
      healthBoxes.forEach(q=>{if(q.g)world.remove(q.g)});
      createHealthWave();
      healthSpawnTimer=0;
    }
    return;
  }
  // Se apenas uma foi coletada, a outra permanece e nenhuma nova aparece.
  for(const q of healthBoxes){
    if(!q.active)continue;
    q.g.rotation.y+=dt*.9;
    q.g.position.y=q.baseY+Math.sin(tm*2.2+q.phase)*.13;
    const dx=P.p.x-q.g.position.x,dz=P.p.z-q.g.position.z,dy=(P.p.y+1)-q.g.position.y;
    if(Math.hypot(dx,dz)<1.65&&Math.abs(dy)<2.2&&hp<mhp){
      const recovered=Math.min(30,mhp-hp);
      hp=Math.min(mhp,hp+30);
      q.active=false;q.g.visible=false;
      fx(V(P.p.x,P.p.y+1,P.p.z),0x42ff88,18,7,.55);
      $('ms').classList.add('heal-msg');msg('+'+recovered+' VIDA');
      snd(760,.12,'sine',.1,1.7);
    }
  }
}


/* ===== CAIXAS DE MUNIÇÃO: mesmo ciclo e posicionamento das caixas de vida ===== */
let ammoSpawnTimer=20;
function createAmmoWave(){
  if(!T||!sc||!world)return;
  ammoBoxes=[];
  const positions=[];
  for(let i=0;i<2;i++){
    let p=null;
    // Reutiliza o posicionador das caixas de vida e evita que as duas caixas
    // da mesma onda apareçam praticamente no mesmo local.
    for(let attempt=0;attempt<45;attempt++){
      const candidate=healthBoxPosition(i===1);
      if(positions.every(other=>H(candidate.x-other.x,candidate.z-other.z)>=5.5)){p=candidate;break}
    }
    if(!p)p=healthBoxPosition(i===1);
    positions.push(p);
    const g=new T.Group();
    const body=new T.Mesh(new T.BoxGeometry(.9,.72,.72),new T.MeshStandardMaterial({color:0x087fbd,emissive:0x03466b,emissiveIntensity:.8,metalness:.55,roughness:.3}));
    g.add(body);
    const lid=new T.Mesh(new T.BoxGeometry(.98,.16,.8),new T.MeshBasicMaterial({color:0x05d9e8}));
    lid.position.y=.28;g.add(lid);
    const band=new T.Mesh(new T.BoxGeometry(.18,.76,.76),new T.MeshBasicMaterial({color:0xeaffff}));
    g.add(band);
    const rim=new T.Mesh(new T.BoxGeometry(1.08,.86,.88),new T.MeshBasicMaterial({color:0x05d9e8,wireframe:true}));
    g.add(rim);
    g.position.copy(p);world.add(g);
    ammoBoxes.push({g,active:true,baseY:p.y,phase:R()*6.28});
  }
}
function spawnAmmoBoxes(){
  ammoBoxes.forEach(q=>{if(q.g&&world)world.remove(q.g)});
  ammoBoxes=[];
  ammoSpawnTimer=20;
}
function updateAmmoBoxes(dt){
  if(!T||!sc||!world)return;
  const waveFinished=ammoBoxes.length===2&&ammoBoxes.every(q=>!q.active);
  const waitingForFirstWave=ammoBoxes.length===0;
  if(waitingForFirstWave||waveFinished){
    ammoSpawnTimer-=dt;
    if(ammoSpawnTimer<=0){
      ammoBoxes.forEach(q=>{if(q.g)world.remove(q.g)});
      createAmmoWave();
      ammoSpawnTimer=0;
    }
    return;
  }
  // A caixa não coletada continua no mapa até o jogador alcançá-la.
  for(const q of ammoBoxes){
    if(!q.active)continue;
    q.g.rotation.y+=dt*.9;
    q.g.position.y=q.baseY+Math.sin(tm*2.2+q.phase)*.13;
    const dx=P.p.x-q.g.position.x,dz=P.p.z-q.g.position.z,dy=(P.p.y+1)-q.g.position.y;
    if(Math.hypot(dx,dz)<1.65&&Math.abs(dy)<2.2){
      // Reabastece carregador e reserva de todas as armas do arsenal,
      // inclusive as que não estão equipadas, respeitando seus limites.
      W.forEach(w=>{
        const maxMag=Math.max(0,Number(w.mag)||0);
        const maxReserve=maxMag*5;
        w.ammo=Math.min(maxMag,Math.max(0,w.ammo)+maxMag);
        w.res=Math.min(maxReserve,Math.max(0,w.res)+maxReserve);
      });
      q.active=false;q.g.visible=false;
      fx(V(P.p.x,P.p.y+1,P.p.z),0x05d9e8,18,7,.55);
      msg('MUNIÇÃO RESTAURADA');
      snd(920,.14,'sine',.1,1.8);
    }
  }
}

/* ===== MULTIPLAYER LAN (Socket.IO) ===== */
const NRLAN={
  socket:null,base:'http://127.0.0.1:3000',room:null,error:'',notice:'',name:localStorage.getItem('nr_lan_name')||'Jogador',ip:'127.0.0.1',code:'',port:'3000',remote:new Map(),tick:0,
  setName(v){this.name=String(v||'Jogador').trim().slice(0,18)||'Jogador';try{localStorage.setItem('nr_lan_name',this.name)}catch(e){}},
  setIp(v){this.ip=String(v||'').trim()},setCode(v){this.code=String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5)},
  loadClient(base,cb){
    this.base=base.replace(/\/$/,'');
    if(window.io){cb();return}
    let old=document.getElementById('nrSocketClient');if(old){old.addEventListener('load',cb,{once:true});old.addEventListener('error',()=>{this.error='Não foi possível carregar o cliente de rede. Confira o endereço e se o servidor está ligado.';menu('lan')},{once:true});return}
    const scpt=document.createElement('script');scpt.id='nrSocketClient';scpt.src=this.base+'/socket.io/socket.io.js';scpt.onload=cb;scpt.onerror=()=>{this.error='Não foi possível alcançar o servidor. Confira IP, porta e Firewall do Windows.';scpt.remove();menu('lan')};document.head.appendChild(scpt);
  },
  connect(base,mode){
    this.error='';this.notice='';this.loadClient(base,()=>{
      if(this.socket){this.socket.disconnect();this.socket=null}
      const sock=window.io(this.base,{transports:['websocket','polling'],timeout:7000,reconnection:true});this.socket=sock;
      sock.on('connect',()=>{if(mode==='create')sock.emit('room:create',{name:this.name});else sock.emit('room:join',{code:this.code,name:this.name})});
      sock.on('connect_error',()=>{this.error='Conexão recusada. Verifique se o anfitrião iniciou INICIAR_SERVIDOR.bat, se o IP está correto e se o Firewall permite Node.js.';menu('lan')});
      sock.on('room:created',r=>{this.room=r;this.code=r.code;this.error='';menu('lanroom')});
      sock.on('room:joined',r=>{this.room=r;this.error='';menu('lanroom')});
      sock.on('room:update',r=>{this.room=r;if(currentMenu==='lanroom')menu('lanroom',null,true);this.syncRemoteRoster(r)});
      sock.on('room:error',e=>{this.error=e;menu('lan')});
      sock.on('room:notice',e=>{this.notice=e;if(currentMenu==='lanroom')menu('lanroom',null,true)});
      sock.on('game:start',d=>{if(!d)return;S.cfg.diff=d.difficulty;sv();this.room=this.room||{};this.room.started=true;startLevel(d.level,true,true)});
      sock.on('player:state',d=>this.updateRemote(d));
      sock.on('disconnect',()=>{this.removeAllRemote();this.notice='Conexão com a sala encerrada.';this.room=null});
    });
  },
  create(){this.connect('http://127.0.0.1:'+this.port,'create')},
  join(){const ip=this.ip.replace(/^https?:\/\//,'').replace(/:\d+$/,'');if(!ip){this.error='Digite o IPv4 do anfitrião.';menu('lan');return}this.connect('http://'+ip+':'+this.port,'join')},
  start(){if(!this.socket||!this.room)return;if(this.room.hostId!==this.socket.id){this.error='Somente o anfitrião pode iniciar.';menu('lanroom');return}const stage=Math.min(S.done,LV.length-1);this.socket.emit('room:start',{level:stage,difficulty:S.cfg.diff})},
  leave(){if(this.socket){this.socket.disconnect();this.socket=null}this.room=null;this.removeAllRemote();this.error='';this.notice='';menu('main')},
  syncRemoteRoster(r){const keep=new Set((r.players||[]).filter(p=>this.socket&&p.id!==this.socket.id).map(p=>p.id));for(const [id,o] of this.remote)if(!keep.has(id)){sc.remove(o.group);this.remote.delete(id)}},
  updateRemote(d){if(!T||!sc||!d||!d.id)return;let o=this.remote.get(d.id);if(!o){const group=new T.Group(),body=new T.Mesh(new T.BoxGeometry(.8,1.45,.48),new T.MeshStandardMaterial({color:0x05d9e8,emissive:0x03434a})),head=new T.Mesh(new T.BoxGeometry(.48,.48,.48),new T.MeshStandardMaterial({color:0xff2a6d,emissive:0x441020}));body.position.y=.85;head.position.y=1.85;group.add(body,head);sc.add(group);o={group,name:d.name||'Jogador'};this.remote.set(d.id,o)}o.name=d.name||o.name;o.group.position.set(d.x,d.y,d.z);o.group.rotation.y=d.yaw||0;o.hp=d.hp},
  removeAllRemote(){for(const o of this.remote.values())if(sc)sc.remove(o.group);this.remote.clear()},
  tickSend(dt){if(!this.socket||!this.room||!this.room.started||state!=='play')return;this.tick+=dt;if(this.tick<.1)return;this.tick=0;this.socket.emit('player:state',{x:P.p.x,y:P.p.y,z:P.p.z,yaw,pit,hp,weapon:cw,alive:state==='play'})}
};

};

/* ===== PERSONALIZAÇÃO ADITIVA DOS CONTROLES MOBILE =====
   Não altera teclado, mouse, Gamepad, mapeador ou handlers existentes. */
const MobileControls=(()=>{
  const STORE='nr_mobile_controls_v1';
  const root=$('touchControls'), panel=$('mobileEditPanel');
  const buttons=()=>Array.from(document.querySelectorAll('#touchActions button,#touchPause'));
  const defaults={};
  let editing=false,drag=null,layout={},selectedKey=null;
  const keyFor=el=>el.id||('action-'+el.dataset.action);
  function captureDefaults(){
    buttons().forEach(el=>{
      const r=el.getBoundingClientRect();
      defaults[keyFor(el)]={x:(r.left+r.width/2)/innerWidth*100,y:(r.top+r.height/2)/innerHeight*100,size:el.id==='touchPause'?46:54};
    });
  }
  function load(){
    try{const v=JSON.parse(localStorage.getItem(STORE)||'{}');if(v&&typeof v==='object')layout=v}catch(e){layout={}}
  }
  function save(){try{localStorage.setItem(STORE,JSON.stringify(layout))}catch(e){}}
  function apply(){
    buttons().forEach(el=>{
      const k=keyFor(el),v=layout[k];if(!v)return;
      const x=cl(Number(v.x)||50,2,98),y=cl(Number(v.y)||50,3,97),size=cl(Number(v.size)||54,34,110);
      el.style.setProperty('--edit-x',x+'%');el.style.setProperty('--edit-y',y+'%');
      el.classList.add('mobile-custom-position');
      el.style.width=size+'px';el.style.height=size+'px';el.style.minWidth='0';
      el.style.fontSize=Math.max(9,Math.min(16,size*.19))+'px';
    });
  }
  function persistPosition(el,x,y){
    const k=keyFor(el),old=layout[k]||defaults[k]||{size:54};
    layout[k]={x:cl(x/innerWidth*100,2,98),y:cl(y/innerHeight*100,3,97),size:old.size||54};save();apply();
  }
  function resize(delta){
    if(!editing)return;
    const el=buttons().find(b=>keyFor(b)===selectedKey)||buttons()[0];
    if(!el)return;
    selectedKey=keyFor(el);
    const base=layout[selectedKey]||defaults[selectedKey]||{x:50,y:50,size:54};
    layout[selectedKey]={x:base.x,y:base.y,size:cl((Number(base.size)||54)+delta,34,110)};
    save();apply();
    buttons().forEach(b=>b.classList.toggle('mobile-edit-selected',keyFor(b)===selectedKey));
  }
  function beginEdit(){
    if(!isMobilePlatform)return;
    if(state==='play'){/* mantém a partida pausada enquanto edita */state='pause';Music.pause();resetInputs()}
    editing=true;
    if(state!=='play'){$('m').style.display='none';$('hud').style.display='block';document.body.classList.add('touch-playing')}
    root.classList.add('mobile-editing');panel.classList.add('show');
    captureDefaults();apply();

  }
  function finish(){

  }

    el.addEventListener('pointerdown',e=>{

    },true);

    el.addEventListener('pointerup',end,true);el.addEventListener('pointercancel',end,true);
  });
  document.addEventListener('fullscreenchange',()=>{
    document.documentElement.classList.toggle('mobile-fullscreen',!!document.fullscreenElement);
    if(isTouchDevice&&deviceClass!=='pc'&&currentMenu==='cf')menu('cf',null,true);
    requestAnimationFrame(()=>{if(editing)apply();if(typeof rz==='function')rz()});
  });

  return{beginEdit,finish,reset,toggleFullscreen,apply,resize};
})();

function updateKeyboardMovement(){
  const vals=[...keyboardHeld.values()];
  K.KeyW=vals.some(k=>k==='w'||k==='z');
  K.KeyA=vals.some(k=>k==='a'||k==='q');
  K.KeyS=vals.some(k=>k==='s');
  K.KeyD=vals.some(k=>k==='d');
}
function isTypingTarget(el){return !!(el&&(el.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)));}

document.addEventListener('mousemove',e=>{
  if(state!=='play')return;

  if(('pointerLockElement' in document)&&document.pointerLockElement!==rd?.domElement&&!pointerLockFallback)return;

});
document.addEventListener('mousedown',e=>{if(state!=='play')return;if(e.button===0)K.fire=1;if(e.button===2)K.gp=1});

document.addEventListener('keydown',e=>{
  if(isTypingTarget(e.target))return;
  if(GP.listening&&e.code==='Escape'){e.preventDefault();GP.cancelBind();return}
  if(MenuNav.isVisible()&&!GP.listening){
    if(e.code==='Escape'){e.preventDefault();MenuNav.goBack();return}
    if(e.code==='ArrowUp'){e.preventDefault();MenuNav.handleDirection('up',1);return}
    if(e.code==='ArrowDown'){e.preventDefault();MenuNav.handleDirection('down',1);return}
    if(e.code==='ArrowLeft'){e.preventDefault();MenuNav.handleDirection('left',1);return}
    if(e.code==='ArrowRight'){e.preventDefault();MenuNav.handleDirection('right',1);return}
  }
  if(e.repeat)return;
  if(e.code==='Escape'&&state==='play'&&!document.pointerLockElement){pauseGame();return}
  keyboardHeld.set(e.code,(e.key||'').toLowerCase());updateKeyboardMovement();
  if(!['KeyW','KeyA','KeyS','KeyD','KeyZ','KeyQ'].includes(e.code))K[e.code]=1;
  if(e.code==='Space'){K.jp=1;e.preventDefault()}
  if(e.code==='ShiftLeft'||e.code==='ShiftRight')K.dash=1;
  if(e.code==='KeyC'||e.code==='ControlLeft'||e.code==='ControlRight')K.cp=1;
  if(e.code==='KeyE')K.gp=1;if(e.code==='KeyR')rel();
  if(/^Digit[1-9]$/.test(e.code))sw(+e.code[5]-1);
});
document.addEventListener('keyup',e=>{
  keyboardHeld.delete(e.code);updateKeyboardMovement();
  if(!['KeyW','KeyA','KeyS','KeyD','KeyZ','KeyQ'].includes(e.code))K[e.code]=0;
  if(e.code==='ShiftLeft'||e.code==='ShiftRight')K.dash=0;
  if(e.code==='KeyC'||e.code==='ControlLeft'||e.code==='ControlRight')K.KeyC=0;
  if(e.code==='KeyE')K.gp=0;
});

}
});
function graphicsFogFar(level=L){const q=S.cfg.q|0;return (level&&level.ceil?70:110)*(q===0?.72:q===1?.88:1)}
function applyGraphicsQuality(resize=true){
  if(!rd||!sc)return;
  const q=cl(S.cfg.q|0,0,2),dpr=Number.isFinite(devicePixelRatio)?devicePixelRatio:1;
  // O antialias é definido na criação do WebGLRenderer e não pode ser alternado
  // com segurança depois; ele permanece habilitado quando o navegador permite.
  rd.setPixelRatio(q===0?Math.min(.75,dpr):q===1?Math.min(1,dpr):cl(dpr,1,2));
